<!DOCTYPE html>
<html lang="ru">
<head>
 <link rel="icon" type="image/x-icon" href="icon.ico">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Стоматолог</title>
<style>
html, body {
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
}
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0a0806;
        font-family: 'Times New Roman', 'Georgia', serif;
    }

    body::before {
        content: '';
        position: fixed; inset: 0;
        background:
            radial-gradient(ellipse at 50% 30%, #2a2218 0%, #0a0806 80%),
            repeating-linear-gradient(45deg, rgba(80,60,40,0.03) 0px, rgba(80,60,40,0.03) 2px, transparent 2px, transparent 6px);
        z-index: 0;
    }

    #scale-wrapper {
        position: fixed;
        top: 50%; left: 50%;
        transform-origin: center center;
        transform: translate(-50%, -50%) scale(1);
        z-index: 1;
    }

    #game-container {
        position: relative;
        width: 1280px;
        height: 800px;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #3a2d1f 0%, #241a10 100%);
        border: 12px solid transparent;
        border-image: linear-gradient(180deg, #8b6f3e 0%, #4a3820 30%, #6b5230 70%, #2e2210 100%) 1;
        box-shadow:
            0 0 0 4px #1a1208,
            0 0 0 6px #a8873e,
            0 0 60px rgba(0,0,0,0.9),
            inset 0 0 80px rgba(0,0,0,0.7);
    }

    .corner {
        position: absolute;
        width: 34px; height: 34px;
        background: radial-gradient(circle at 35% 30%, #d4b872 0%, #8b6f3e 40%, #4a3820 80%, #241a10 100%);
        border-radius: 50%;
        box-shadow: inset 0 -3px 4px rgba(0,0,0,0.8), inset 0 3px 4px rgba(255,220,150,0.4), 0 2px 6px black;
        z-index: 100;
        pointer-events: none;
    }
    .corner.tl { top: -6px; left: -6px; }
    .corner.tr { top: -6px; right: -6px; }
    .corner.bl { bottom: -6px; left: -6px; }
    .corner.br { bottom: -6px; right: -6px; }

    .civ-panel {
        position: relative;
        background: linear-gradient(180deg, rgba(60,45,28,0.98) 0%, rgba(30,22,14,0.98) 100%);
        border: 2px solid #8b6f3e;
        box-shadow:
            inset 0 0 0 1px #3a2d1f,
            inset 0 0 30px rgba(0,0,0,0.8),
            inset 0 2px 6px rgba(255,200,120,0.1),
            0 4px 8px rgba(0,0,0,0.7);
        border-radius: 4px;
        color: #e8d9b0;
        text-shadow: 1px 1px 2px #000;
    }
    .civ-panel::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent 0%, #c9a24a 20%, #e8c874 50%, #c9a24a 80%, transparent 100%);
        border-radius: 4px 4px 0 0;
    }

    .top-bar {
        height: 62px;
        margin: 10px 12px 6px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        background: linear-gradient(180deg, #4a3820 0%, #2a1e12 100%);
        border: 2px solid #8b6f3e;
        border-radius: 4px;
        box-shadow:
            inset 0 0 0 1px #1a1208,
            inset 0 0 25px rgba(0,0,0,0.9),
            inset 0 2px 4px rgba(255,200,120,0.15),
            0 4px 10px rgba(0,0,0,0.8);
        position: relative;
    }
    .top-bar::after {
        content: '';
        position: absolute;
        bottom: -3px; left: 10%; right: 10%; height: 2px;
        background: linear-gradient(90deg, transparent, #c9a24a, transparent);
    }

    .title {
        font-size: 24px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #f0dca4;
        font-family: 'Times New Roman', serif;
        font-weight: bold;
        text-shadow:
            0 0 8px rgba(255,200,100,0.5),
            2px 2px 0 #1a1208,
            1px 1px 4px #000;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .title .icon {
        font-size: 26px;
        filter: drop-shadow(0 0 6px #ffb347);
    }

    .score-panel {
        display: flex;
        gap: 28px;
        font-size: 15px;
        font-family: 'Times New Roman', serif;
        color: #e8d9b0;
        background: linear-gradient(180deg, rgba(20,14,8,0.9) 0%, rgba(40,28,16,0.9) 100%);
        padding: 7px 22px;
        border-radius: 3px;
        border: 2px solid #6b5230;
        box-shadow:
            inset 0 0 15px rgba(0,0,0,0.9),
            inset 0 1px 3px rgba(200,160,80,0.2),
            0 2px 4px rgba(0,0,0,0.6);
        letter-spacing: 1px;
    }
    .score-panel span { white-space: nowrap; }
    .score-panel .num {
        color: #ffd966;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(255,200,80,0.6);
    }

    .main-area {
        flex: 1;
        display: flex;
        margin: 0 12px 8px 12px;
        gap: 10px;
        min-height: 0;
    }

    .toolbox {
        width: 250px;
        display: flex;
        flex-direction: column;
        padding: 12px 10px;
        gap: 10px;
        background: linear-gradient(180deg, #3a2d1f 0%, #1e1610 100%);
        border: 2px solid #8b6f3e;
        border-radius: 4px;
        box-shadow:
            inset 0 0 0 1px #1a1208,
            inset 0 0 40px rgba(0,0,0,0.9),
            inset 0 2px 6px rgba(255,200,120,0.08),
            0 4px 10px rgba(0,0,0,0.8);
        position: relative;
        overflow-y: auto;
    }
    .toolbox::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent 0%, #c9a24a 20%, #e8c874 50%, #c9a24a 80%, transparent 100%);
        border-radius: 4px 4px 0 0;
    }

    .tool-section {
        background: linear-gradient(180deg, rgba(20,14,8,0.9) 0%, rgba(45,32,18,0.9) 100%);
        border-radius: 3px;
        padding: 10px 10px 6px 10px;
        border: 2px solid #6b5230;
        box-shadow:
            inset 0 0 20px rgba(0,0,0,0.9),
            inset 0 1px 2px rgba(200,160,80,0.15);
        position: relative;
    }
    .tool-section h3 {
        margin: 0 0 10px 0;
        font-size: 13px;
        text-transform: uppercase;
        color: #e8c874;
        text-align: center;
        letter-spacing: 3px;
        font-family: 'Times New Roman', serif;
        font-weight: bold;
        border-bottom: 1px solid #6b5230;
        padding-bottom: 6px;
        text-shadow: 1px 1px 0 #000, 0 0 8px rgba(200,160,80,0.3);
    }

    .tool-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 10px 6px;
        margin-bottom: 8px;
        background: linear-gradient(180deg, #a8894f 0%, #7a6238 45%, #5a4526 55%, #4a3820 100%);
        border: 2px solid #c9a24a;
        border-radius: 3px;
        color: #fff4dd;
        font-weight: bold;
        font-size: 13px;
        font-family: 'Times New Roman', serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 #1a1208, 0 0 6px rgba(255,200,80,0.3);
        box-shadow:
            inset 0 1px 2px rgba(255,230,170,0.5),
            inset 0 -2px 4px rgba(0,0,0,0.6),
            0 3px 0 #1a1208,
            0 4px 6px rgba(0,0,0,0.7);
        cursor: pointer;
        transition: 0.08s;
        position: relative;
        overflow: hidden;
    }
    .tool-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 45%;
        background: linear-gradient(180deg, rgba(255,240,200,0.25), transparent);
        pointer-events: none;
    }
    .tool-btn:hover {
        background: linear-gradient(180deg, #c9a24a 0%, #96793f 45%, #6b5230 55%, #5a4526 100%);
        box-shadow:
            inset 0 1px 2px rgba(255,230,170,0.6),
            inset 0 -2px 4px rgba(0,0,0,0.6),
            0 3px 0 #1a1208,
            0 4px 10px rgba(255,200,80,0.4);
    }
    .tool-btn:active {
        transform: translateY(3px);
        box-shadow:
            inset 0 2px 4px rgba(0,0,0,0.8),
            0 0 0 #1a1208,
            0 1px 3px rgba(0,0,0,0.6);
    }
    .tool-btn.active {
        background: linear-gradient(180deg, #e8c874 0%, #c9a24a 45%, #a8873e 55%, #8b6f3e 100%);
        border-color: #f0dca4;
        color: #1a1208;
        text-shadow: 1px 1px 0 #e8d9b0, 0 0 10px rgba(255,220,120,0.8);
        box-shadow:
            inset 0 1px 3px rgba(255,255,220,0.7),
            inset 0 -2px 4px rgba(80,50,20,0.5),
            0 3px 0 #4a3820,
            0 0 18px rgba(255,200,80,0.7);
    }
    .tool-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        filter: grayscale(0.6);
        transform: none;
    }

    select {
        width: 100%;
        padding: 8px 6px;
        background: linear-gradient(180deg, #2a1e12 0%, #1a1208 100%);
        color: #f0dca4;
        border: 2px solid #8b6f3e;
        border-radius: 3px;
        font-weight: bold;
        font-size: 13px;
        font-family: 'Times New Roman', serif;
        outline: none;
        cursor: pointer;
        box-shadow:
            inset 0 0 10px rgba(0,0,0,0.9),
            inset 0 1px 2px rgba(200,160,80,0.2);
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }
    select:hover {
        border-color: #c9a24a;
        box-shadow:
            inset 0 0 10px rgba(0,0,0,0.9),
            inset 0 1px 2px rgba(200,160,80,0.3),
            0 0 10px rgba(200,160,80,0.4);
    }
    select option {
        background: #1a1208;
        color: #f0dca4;
        padding: 6px;
    }
    select option:disabled {
        color: #6a5a3a;
    }

    .anesthetic-info {
        font-size: 11px;
        color: #a89572;
        text-align: center;
        margin: -4px 0 8px 0;
        line-height: 1.3;
    }

    .dental-area {
        flex: 1;
        position: relative;
        border-radius: 6px;
        border: 4px solid #4a3820;
        box-shadow:
            inset 0 0 0 2px #8b6f3e,
            inset 0 0 0 3px #1a1208,
            inset 0 0 80px rgba(0,0,0,0.95),
            0 6px 16px rgba(0,0,0,0.9);
        overflow: hidden;
        background: radial-gradient(ellipse 85% 65% at 50% 50%,
                #7a3530 0%,
                #5a221e 35%,
                #3a1210 65%,
                #1e0806 90%,
                #0f0404 100%);
    }
    .dental-area::before {
        content: '';
        position: absolute; inset: 0;
        background:
            radial-gradient(ellipse 25% 12% at 28% 32%, rgba(255,200,170,0.12) 0%, transparent 100%),
            radial-gradient(ellipse 22% 10% at 72% 58%, rgba(255,200,170,0.08) 0%, transparent 100%),
            radial-gradient(circle at 50% 50%, rgba(120,30,20,0.35) 0%, transparent 70%);
        pointer-events: none;
        z-index: 1;
    }
    .dental-area::after {
        content: '';
        position: absolute; inset: 0;
        background:
            repeating-radial-gradient(circle at 20% 40%, rgba(180,60,40,0.06) 0px, transparent 3px),
            repeating-radial-gradient(circle at 70% 70%, rgba(180,60,40,0.05) 0px, transparent 4px);
        pointer-events: none;
        z-index: 2;
    }

    .mouth-container {
        position: absolute; inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 10px;
    }

    .teeth-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        gap: 28px;
        position: relative;
        z-index: 5;
    }

    .teeth-row {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 2px;
        width: 100%;
        padding: 0 6px;
        position: relative;
    }
    .lower-row { align-items: flex-start; }

    .tooth {
        width: 44px;
        height: 68px;
        position: relative;
        cursor: pointer;
        transition: filter 0.2s, transform 0.15s;
        z-index: 5;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.75));
    }
    .tooth:hover {
        filter: drop-shadow(0 0 10px rgba(255,220,120,0.7)) drop-shadow(0 4px 6px rgba(0,0,0,0.75));
        z-index: 15;
    }

    .tooth-body {
        position: absolute; inset: 0;
        background:
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 35%),
            radial-gradient(ellipse at 62% 72%, rgba(200,200,180,0.4) 0%, transparent 50%),
            linear-gradient(160deg,
                #faf7ee 0%,
                #ece6d5 22%,
                #ddd5bd 45%,
                #cfc4a8 65%,
                #b8ac8e 85%,
                #a89a7c 100%);
        box-shadow:
            inset 0 0 10px rgba(255,255,255,0.7),
            inset 0 -8px 12px rgba(120,100,70,0.4),
            inset 5px 0 8px rgba(255,255,255,0.3),
            inset -5px 0 10px rgba(90,70,50,0.3);
        border: 1px solid rgba(140,120,90,0.6);
    }
    .upper-row .tooth-body {
        border-radius: 45% 45% 25% 25% / 55% 55% 45% 45%;
        clip-path: polygon(8% 0%, 92% 0%, 100% 35%, 96% 85%, 88% 100%, 12% 100%, 4% 85%, 0% 35%);
    }
    .lower-row .tooth-body {
        border-radius: 25% 25% 45% 45% / 45% 45% 55% 55%;
        clip-path: polygon(0% 15%, 8% 0%, 92% 0%, 100% 15%, 96% 100%, 4% 100%);
    }
    .tooth[data-type="incisor"] .tooth-body {
        border-radius: 35% 35% 20% 20% / 50% 50% 40% 40%;
    }
    .tooth[data-type="canine"] .tooth-body {
        clip-path: polygon(20% 0%, 80% 0%, 95% 25%, 100% 60%, 85% 100%, 15% 100%, 0% 60%, 5% 25%);
    }
    .tooth[data-type="molar"] .tooth-body {
        width: 50px;
        border-radius: 40% 40% 30% 30% / 45% 45% 45% 45%;
    }
    .tooth[data-type="molar"] .tooth-body::after,
    .tooth[data-type="premolar"] .tooth-body::after {
        content: '';
        position: absolute;
        top: 20%; left: 15%;
        width: 70%; height: 40%;
        background:
            radial-gradient(ellipse 8px 6px at 25% 30%, rgba(100,80,50,0.5) 0%, transparent 100%),
            radial-gradient(ellipse 8px 6px at 75% 30%, rgba(100,80,50,0.5) 0%, transparent 100%),
            radial-gradient(ellipse 6px 4px at 50% 55%, rgba(100,80,50,0.4) 0%, transparent 100%);
        pointer-events: none;
    }

    .tooth[data-caries="1"] .tooth-body {
        background:
            radial-gradient(ellipse 12px 8px at 40% 40%, rgba(60,40,20,0.55) 0%, rgba(90,60,30,0.4) 30%, transparent 70%),
            radial-gradient(ellipse 8px 6px at 65% 60%, rgba(70,45,25,0.4) 0%, transparent 70%),
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 35%),
            linear-gradient(160deg, #f8f5ec 0%, #ece6d5 22%, #ddd5bd 45%, #cfc4a8 65%, #b8ac8e 85%, #a89a7c 100%);
    }
    .tooth[data-caries="2"] .tooth-body {
        background:
            radial-gradient(ellipse 16px 12px at 42% 45%, rgba(40,22,8,0.85) 0%, rgba(70,40,15,0.7) 35%, rgba(110,70,35,0.4) 60%, transparent 80%),
            radial-gradient(ellipse 10px 8px at 68% 65%, rgba(50,30,10,0.6) 0%, transparent 75%),
            radial-gradient(ellipse 6px 5px at 25% 60%, rgba(60,35,15,0.5) 0%, transparent 75%),
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 35%),
            linear-gradient(160deg, #e8e0cc 0%, #d8cfb5 25%, #c0b498 50%, #a89878 75%, #8a7a5a 100%);
        box-shadow:
            inset 0 0 20px rgba(40,20,0,0.5),
            inset 0 -8px 12px rgba(60,40,20,0.5),
            inset 5px 0 8px rgba(200,180,150,0.2);
    }
    .tooth[data-caries="3"] .tooth-body {
        background:
            radial-gradient(ellipse 20px 16px at 45% 50%, rgba(20,10,3,0.98) 0%, rgba(45,22,5,0.95) 40%, rgba(80,45,15,0.7) 65%, rgba(120,80,40,0.4) 85%, transparent 100%),
            radial-gradient(ellipse 14px 10px at 70% 70%, rgba(30,15,5,0.85) 0%, transparent 80%),
            radial-gradient(ellipse 10px 8px at 22% 55%, rgba(35,20,8,0.8) 0%, transparent 80%),
            radial-gradient(ellipse 8px 6px at 55% 30%, rgba(50,30,12,0.7) 0%, transparent 75%),
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 35%),
            linear-gradient(160deg, #c8b898 0%, #a89878 25%, #887858 50%, #685840 75%, #4a3c28 100%);
        box-shadow:
            inset 0 0 30px rgba(10,5,0,0.9),
            inset 0 -8px 15px rgba(20,10,0,0.8),
            0 0 12px rgba(30,15,0,0.5);
        border-color: rgba(50,30,15,0.9);
    }
    .tooth[data-drilled="1"] .tooth-body {
        background:
            radial-gradient(ellipse 15px 12px at 45% 50%, rgba(0,0,0,0.95) 0%, rgba(20,12,5,0.9) 40%, rgba(60,40,20,0.5) 70%, transparent 90%),
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.7) 0%, transparent 35%),
            linear-gradient(160deg, #d0c8b0 0%, #b8ac90 30%, #9a8e70 60%, #7a6e52 100%);
        box-shadow:
            inset 0 0 25px rgba(0,0,0,0.9),
            inset 0 -6px 12px rgba(0,0,0,0.7);
    }
    .tooth.treated .tooth-body {
        background:
            radial-gradient(ellipse 10px 8px at 45% 55%, rgba(180,200,180,0.9) 0%, rgba(200,215,200,0.6) 40%, transparent 70%),
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 35%),
            linear-gradient(160deg, #f8f8f0 0%, #eef0e4 25%, #dde0d0 50%, #cdd0bc 75%, #bcc0a8 100%);
        box-shadow:
            inset 0 0 12px rgba(255,255,255,0.9),
            inset 0 -6px 10px rgba(120,140,100,0.3),
            0 0 8px rgba(180,220,160,0.4);
        border-color: rgba(140,160,120,0.7);
    }
    .tooth.treated .tooth-body::before {
        content: '';
        position: absolute;
        top: 30%; left: 30%;
        width: 40%; height: 35%;
        border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
        background:
            radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.7) 0%, transparent 50%),
            linear-gradient(140deg, #b8bcc0 0%, #8a8e94 40%, #6a6e74 70%, #9a9ea4 100%);
        box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), inset 0 -3px 6px rgba(0,0,0,0.4);
        opacity: 0.9;
    }
    .tooth.anesthetized {
        filter: drop-shadow(0 0 12px #4aa8ff) drop-shadow(0 0 6px #88ccff) drop-shadow(0 4px 6px rgba(0,0,0,0.75));
    }
    .tooth.anesthetized .tooth-body {
        box-shadow:
            inset 0 0 15px rgba(100,180,255,0.4),
            inset 0 -6px 10px rgba(60,120,180,0.4),
            0 0 15px rgba(80,180,255,0.5);
    }

    /* Невылечиваемый зуб */
    .tooth.unhealable .tooth-body {
        background:
            radial-gradient(ellipse 18px 14px at 45% 50%, rgba(10,5,2,0.98) 0%, rgba(30,15,5,0.95) 45%, rgba(60,30,10,0.7) 70%, transparent 100%),
            radial-gradient(ellipse 12px 9px at 70% 65%, rgba(20,10,3,0.9) 0%, transparent 80%),
            radial-gradient(ellipse 10px 8px at 25% 55%, rgba(25,12,4,0.9) 0%, transparent 80%),
            radial-gradient(ellipse at 35% 25%, rgba(255,255,255,0.4) 0%, transparent 35%),
            linear-gradient(160deg, #6a5a48 0%, #4a3c2c 30%, #2e2418 70%, #1a1208 100%);
        box-shadow:
            inset 0 0 35px rgba(0,0,0,0.95),
            inset 0 -8px 15px rgba(0,0,0,0.9),
            0 0 15px rgba(80,20,0,0.6);
        border-color: rgba(60,20,10,0.9);
    }
    .tooth.unhealable .tooth-body::after {
        content: '✖';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,80,60,0.65);
        font-size: 28px;
        font-weight: bold;
        text-shadow: 0 0 8px rgba(255,60,40,0.8), 1px 1px 0 #000;
        pointer-events: none;
    }
    .tooth.unhealable {
        filter: drop-shadow(0 0 8px rgba(180,40,20,0.7)) drop-shadow(0 4px 6px rgba(0,0,0,0.75));
    }

    /* Пустое место (после удаления) */
    .tooth.empty {
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
    .tooth.empty .tooth-body {
        background:
            radial-gradient(ellipse 14px 10px at 50% 55%, rgba(20,10,5,0.95) 0%, rgba(50,25,12,0.8) 50%, rgba(80,40,20,0.5) 80%, transparent 100%);
        box-shadow:
            inset 0 0 25px rgba(0,0,0,0.95),
            inset 0 -4px 10px rgba(0,0,0,0.9);

        background:

    .tooth.filled .tooth-body {

        top: 25%; left: 25%;
        width: 50%; height: 45%;

                card.addEventListener('click', () => startLevel(idx));
            }
            levelGrid.appendChild(card);
        });
    }

    // ========== HUD ЭЛЕМЕНТЫ ==========
    const upperRowEl = document.getElementById('upper-row');
    const lowerRowEl = document.getElementById('lower-row');
    const tooltipEl = document.getElementById('tooth-tooltip');
    const tooltipTitle = document.getElementById('tooltip-title');
    const tooltipContent = document.getElementById('tooltip-content');
    const toastEl = document.getElementById('toast');

    const anesthesiaCountSpan = document.getElementById('anesthesia-count');
    const treatedCountSpan = document.getElementById('treated-count');
    const goalCountSpan = document.getElementById('goal-count');
    const moneyCountSpan = document.getElementById('money-count');
    const hospitalTitle = document.getElementById('hospital-title');
    const hudLevel = document.getElementById('hud-level');
    const hudGoal = document.getElementById('hud-goal');
    const hudAnesLeft = document.getElementById('hud-anes-left');

    let currentTool = null;

    function showToast(message, isGood = true) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        playSound(isGood ? 'success' : 'error');
        setTimeout(() => toastEl.classList.remove('show'), 1800);
    }
    function setStatus(text) { statusText.textContent = text; }

    function updateCounters() {
        anesthesiaCountSpan.textContent = game.anesthesiaUsed;
        treatedCountSpan.textContent = game.treatedCount;
        goalCountSpan.textContent = game.patientsGoal;
        moneyCountSpan.textContent = game.money;

        hudGoal.textContent = game.patientsGoal;

        for (const k in game.anestheticStock) total += game.anestheticStock[k];
        hudAnesLeft.textContent = total;
    }

    // ========== ГЕНЕРАЦИЯ ЗУБОВ ==========
    function generateToothData(levelIdx) {
        const lvl = LEVELS[levelIdx];
        const cc = lvl.cariesChance;
        const emptyChance = lvl.emptyChance || 0;
        const unhealableChance = lvl.unhealableChance || 0;
        toothStates.clear();
        [...upperOrder, ...lowerOrder].forEach((tooth) => {
            let state = {
                ...tooth,
                caries: 0,
                treated: false,
                anesthetized: false,
                antiseptic: false,
                drilled: false,
                empty: false,
                filled: false,
                unhealable: false,
                anestheticType: null
            };
            const r = Math.random();
            if (r < emptyChance) {
                // Пустое место
                state.empty = true;
                state.caries = 0;
            } else {
                // Генерация кариеса
                const rand = Math.random();
                if (rand < cc.healthy) state.caries = 0;
                else if (rand < cc.healthy + cc.light) state.caries = 1;
                else if (rand < cc.healthy + cc.light + cc.medium) state.caries = 2;
                else state.caries = 3;

                // Невылечиваемый зуб (только если есть кариес)
                if (state.caries > 0 && Math.random() < unhealableChance) {
                    state.unhealable = true;
                }
            }
            toothStates.set(tooth.id, state);
        });
    }

    // ========== СОЗДАНИЕ ЭЛЕМЕНТА ЗУБА ==========
    function createToothElement(toothId) {
        const state = toothStates.get(toothId);
        const div = document.createElement('div');
        div.className = 'tooth';
        div.dataset.id = toothId;
        div.dataset.type = state.type;
        div.dataset.caries = state.empty ? '0' : (state.treated ? '0' : state.caries);
        if (state.treated) div.classList.add('treated');
        if (state.anesthetized) div.classList.add('anesthetized');
        if (state.empty) div.classList.add('empty');
        if (state.filled) div.classList.add('filled');
        if (state.unhealable && !state.empty) div.classList.add('unhealable');

        const body = document.createElement('div');
        body.className = 'tooth-body';
        div.appendChild(body);

        const label = document.createElement('span');
        label.className = 'tooth-label';
        label.textContent = state.fdi;
        div.appendChild(label);

        div.addEventListener('mouseenter', (e) => showTooltipForTooth(toothId, e));
        div.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });
        div.addEventListener('click', () => handleToothClick(toothId));
        return div;
    }

    function showTooltipForTooth(toothId, event) {
        const state = toothStates.get(toothId);
        if (!state) return;
        let cariesClass, cariesText;
        if (state.empty) { cariesText = '⚪ Пустое место'; cariesClass = 'status-warn'; }
        else if (state.filled) { cariesText = '⚙️ Пломба'; cariesClass = 'status-good'; }
        else if (state.treated) { cariesText = '✅ Вылечен'; cariesClass='status-good'; }
        else if (state.unhealable) { cariesText = '⛔ Невылечиваемый'; cariesClass='status-unhealable'; }
        else if (state.caries === 0) { cariesText = '🟢 Здоров'; cariesClass='status-good'; }
        else if (state.caries === 1) { cariesText = '🟡 Начальный кариес'; cariesClass='status-warn'; }
        else if (state.caries === 2) { cariesText = '🟠 Средний кариес'; cariesClass='status-warn'; }
        else { cariesText = '🔴 Глубокий кариес'; cariesClass='status-bad'; }

        const anes = state.anesthetized
            ? `<span class="val status-treat">💉 Анестезирован (${getAnestheticName(state.anestheticType || game.selectedAnesthetic)})</span>`
            : `<span class="val status-bad">❌ Без анестезии</span>`;
        const antis = state.antiseptic
            ? `<span class="val status-good">🧴 Обработан</span>`
            : `<span class="val status-warn">❌ Не обработан</span>`;

        tooltipTitle.textContent = state.empty
            ? `Место ${state.fdi} — пусто`
            : `Зуб ${state.fdi} — ${state.name}`;
        tooltipContent.innerHTML = `
            <div class="row"><span class="label">Тип:</span><span class="val">${
                state.type==='incisor'?'Резец':state.type==='canine'?'Клык':state.type==='premolar'?'Премоляр':'Моляр'
            }</span></div>
            <div class="row"><span class="label">Квадрант:</span><span class="val">${state.quadrant}</span></div>
            <div class="row"><span class="label">Состояние:</span><span class="val ${cariesClass}">${cariesText}</span></div>
            ${!state.empty ? `<div class="row"><span class="label">Анестезия:</span>${anes}</div>` : ''}
            ${!state.empty && !state.unhealable ? `<div class="row"><span class="label">Антисептик:</span>${antis}</div>` : ''}
            <div class="row" style="margin-top:6px;border-top:1px solid #5a4a3a;padding-top:6px;">
                <span class="label">FDI:</span><span class="val">${state.fdi}</span>
            </div>
        `;

        const rect = event.target.getBoundingClientRect();
        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        let left = rect.right - containerRect.left + 15;
        let top = rect.top - containerRect.top - 20;
        if (left + 280 > containerRect.width) left = rect.left - containerRect.left - 290;
        if (top + 220 > containerRect.height) top = containerRect.height - 240;
        if (top < 10) top = 10;
        tooltipEl.style.left = left + 'px';
        tooltipEl.style.top = top + 'px';
        tooltipEl.style.display = 'block';
    }

    // ========== ТАЙМЕР АНЕСТЕЗИИ ==========
    function startAnesthesiaTimer(toothId) {
        if (game.anesthesiaTimers.has(toothId)) {
            clearTimeout(game.anesthesiaTimers.get(toothId).timerId);
        }
        const state = toothStates.get(toothId);
        const anesType = state.anestheticType || game.selectedAnesthetic;
        const duration = ANESTHETICS[anesType].duration * 1000;

        const endTime = Date.now() + duration;
        const timerId = setTimeout(() => {
            const s = toothStates.get(toothId);
            if (s) {
                s.anesthetized = false;
                s.anestheticType = null;
                updateToothElement(toothId);
            }
            game.anesthesiaTimers.delete(toothId);
            if (game.activeTimerTooth === toothId) {
                game.activeTimerTooth = null;
                timerBar.style.display = 'none';
                clearInterval(game.timerInterval);
                game.timerInterval = null;
            }
            showToast(`⏰ Анестезия на зубе ${s ? s.fdi : ''} закончилась!`, false);
        }, duration);

        game.anesthesiaTimers.set(toothId, { timerId, endTime });

        game.activeTimerTooth = toothId;
        timerBar.style.display = 'block';
        if (game.timerInterval) clearInterval(game.timerInterval);
        game.timerInterval = setInterval(() => {
            const t = game.anesthesiaTimers.get(game.activeTimerTooth);
            if (!t) { timerBar.style.display = 'none'; return; }
            const left = Math.max(0, t.endTime - Date.now());
            const total = ANESTHETICS[toothStates.get(game.activeTimerTooth)?.anestheticType || anesType].duration * 1000;
            const pct = (left / total) * 100;
            timerFill.style.width = pct + '%';
            if (left <= 0) {
                timerBar.style.display = 'none';
                clearInterval(game.timerInterval);
                game.timerInterval = null;
            }
        }, 100);
    }

    // ========== КЛИК ПО ЗУБУ ==========
    function handleToothClick(toothId) {
        if (!game.gameActive) return;
        const state = toothStates.get(toothId);
        if (!state) return;
        if (!currentTool) { showToast('Сначала выберите инструмент', false); return; }

        // === УДАЛЕНИЕ ===
        if (currentTool === 'extract') {
            if (state.empty) { showToast('Здесь уже пусто', false); return; }
            if (state.filled) { showToast('Сначала удалите пломбу', false); return; }
            if (!state.unhealable) { showToast('Этот зуб можно вылечить!', false); playSound('error'); return; }
            if (!state.anesthetized) { showToast('Сначала введите анестезию!', false); playSound('error'); return; }
            // Удаляем
            state.empty = true;
            state.unhealable = false;
            state.caries = 0;
            state.treated = false;
            state.drilled = false;
            state.antiseptic = false;
            state.anesthetized = false;
            state.anestheticType = null;
            state.filled = false;
            updateToothElement(toothId);
            playSound('extract');
            setStatus('Зуб удалён. Образовалось пустое место.');
            showToast('🦷 Зуб удалён! Теперь здесь пусто', true);
            return;
        }

        // === ПЛОМБА ===
        if (currentTool === 'fill') {
            if (!state.empty) { showToast('Пломбу можно поставить только в пустое место', false); playSound('error'); return; }
            if (state.filled) { showToast('Здесь уже стоит пломба', false); return; }
            if (game.money < FILL_PRICE) { showToast(`Недостаточно денег! Нужно 💰 ${FILL_PRICE}`, false); playSound('error'); return; }
            if (!state.anesthetized) {
                showToast('Сначала введите анестезию в это место!', false);
                playSound('error');
                return;
            }
            if (!state.antiseptic) {
                showToast('Сначала обработайте место антисептиком!', false);
                playSound('error');
                return;
            }
            game.money -= FILL_PRICE;
            state.filled = true;
            state.empty = false;
            state.treated = true;
            updateToothElement(toothId);
            updateCounters();
            playSound('fill');
            setStatus('Пломба установлена');
            showToast('⚙️ Пломба установлена! Место восстановлено', true);
            game.treatedCount++;
            updateCounters();
            checkLevelComplete();
            return;
        }

        // === АНЕСТЕЗИЯ ===
        if (currentTool === 'anesthesia') {
            // Пустое место, уже запломбированное — анестезия не нужна
            if (state.empty && state.filled) { showToast('Это место уже запломбировано', false); return; }
            // Уже анестезировано
            if (state.anesthetized) { showToast('Уже анестезировано', false); return; }
            // Обычный вылеченный зуб — не трогаем
            if (!state.empty && state.treated) { showToast('Зуб уже вылечен', false); return; }

            const stock = game.anestheticStock[game.selectedAnesthetic] || 0;
            if (stock <= 0) {
                showToast(`Нет ${getAnestheticName(game.selectedAnesthetic)}! Купите анестетик.`, false);
                playSound('error');
                return;
            }
            game.anestheticStock[game.selectedAnesthetic] = stock - 1;
            state.anesthetized = true;
            state.anestheticType = game.selectedAnesthetic;
            game.anesthesiaUsed++;
            updateCounters();
            updateToothElement(toothId);
            playSound('anesthesia');
            setStatus(`Введён анестетик: ${getAnestheticName(game.selectedAnesthetic)}`);
            showToast(`💉 Анестезия введена (${getAnestheticName(game.selectedAnesthetic)})`);
            startAnesthesiaTimer(toothId);
            return;
        }

        // === БОРМАШИНА ===
        if (currentTool === 'drill') {
            if (state.empty) { showToast('Это пустое место, сверлить нечего', false); return; }
            if (state.unhealable) { showToast('Этот зуб невылечиваемый — его нужно удалить!', false); playSound('error'); return; }
            if (state.treated) { showToast('Зуб уже вылечен', false); return; }
            if (!state.anesthetized) { showToast('Сначала введите анестезию!', false); playSound('error'); return; }
            if (state.caries === 0) { showToast('Зуб здоров, нечего сверлить', false); return; }
            if (state.drilled) { showToast('Полость уже обработана бормашиной', false); return; }
            state.drilled = true;
            state.caries = 0;
            updateToothElement(toothId);
            playSound('drill');
            setStatus('Бормашина: кариозные ткани удалены. Требуется антисептик');
            showToast('🔩 Кариес удалён. Обработайте антисептиком');
            return;
        }

        // === АНТИСЕПТИК ===
        if (currentTool === 'antiseptic') {
            if (state.empty && !state.filled) {
                // Обработка пустого места под пломбу
                if (state.antiseptic) { showToast('Уже обработано', false); return; }
                if (!state.anesthetized) { showToast('Сначала введите анестезию в это место!', false); playSound('error'); return; }
                state.antiseptic = true;
                updateToothElement(toothId);
                playSound('antiseptic');
                setStatus('Место обработано антисептиком. Можно ставить пломбу');
                showToast('🧴 Место обработано. Теперь можно ставить пломбу', true);
                return;
            }
            if (state.empty) { showToast('Пустое место — нечего обрабатывать', false); return; }
            if (state.unhealable) { showToast('Этот зуб невылечиваемый — его нужно удалить!', false); playSound('error'); return; }
            if (state.treated) { showToast('Зуб уже вылечен', false); return; }
            if (state.caries > 0) { showToast('Сначала удалите кариес бормашиной!', false); playSound('error'); return; }
            if (!state.drilled) { showToast('Сначала просверлите зуб бормашиной!', false); playSound('error'); return; }
            if (state.antiseptic) { showToast('Уже обработан антисептиком', false); return; }
            state.antiseptic = true;
            state.treated = true;
            updateToothElement(toothId);
            playSound('antiseptic');
            setStatus('Обработка антисептиком завершена');
            showToast('🧴 Обработано антисептиком. Зуб вылечен!', true);
            game.treatedCount++;
            updateCounters();
            checkLevelComplete();
            return;
        }
    }

    function updateToothElement(toothId) {
        const el = document.querySelector(`.tooth[data-id="${toothId}"]`);
        if (!el) return;
        const state = toothStates.get(toothId);
        if (!state) return;
        el.classList.toggle('treated', state.treated && !state.empty);
        el.classList.toggle('anesthetized', state.anesthetized);
        el.classList.toggle('empty', state.empty && !state.filled);
        el.classList.toggle('filled', state.filled);
        el.classList.toggle('unhealable', state.unhealable && !state.empty && !state.treated);
        el.dataset.caries = (state.empty || state.treated) ? '0' : state.caries;
        if (state.drilled && !state.treated && !state.empty) el.dataset.drilled = '1';
        else delete el.dataset.drilled;
    }

    function checkLevelComplete() {
        if (game.treatedCount >= game.patientsGoal) {
            game.gameActive = false;
            const lvl = LEVELS[game.currentLevel];
            game.money += lvl.reward;
            updateCounters();
            playSound('coin');
            setTimeout(() => {
                showToast(`🎉 Уровень пройден! Награда: 💰 ${lvl.reward}`, true);
                game.completedLevels.add(game.currentLevel);
                if (game.currentLevel + 1 < LEVELS.length && game.unlockedLevels <= game.currentLevel + 1) {
                    game.unlockedLevels = game.currentLevel + 2;
                }
                renderLevels();
                setTimeout(() => {
                    levelScreen.style.display = 'flex';
                    renderLevels();
                }, 2000);
            }, 500);
        }
    }

    // ========== РЕНДЕР ЗУБОВ ==========
    function renderTeeth() {
        upperRowEl.innerHTML = '';
        lowerRowEl.innerHTML = '';
        upperOrder.forEach(t => upperRowEl.appendChild(createToothElement(t.id)));
        lowerOrder.forEach(t => lowerRowEl.appendChild(createToothElement(t.id)));
    }

    // ========== УПРАВЛЕНИЕ ИНСТРУМЕНТАМИ ==========
    const btnAnesthesia = document.getElementById('apply-anesthesia');
    const btnDrill = document.getElementById('tool-drill');
    const btnAntiseptic = document.getElementById('tool-antiseptic');
    const btnExtract = document.getElementById('tool-extract');
    const btnFill = document.getElementById('tool-fill');
    const btnReset = document.getElementById('tool-reset');
    const btnBuy = document.getElementById('buy-anesthetic');
    const btnBack = document.getElementById('back-to-levels');

    function setActiveTool(tool) {
        [btnAnesthesia, btnDrill, btnAntiseptic, btnExtract, btnFill].forEach(b => b.classList.remove('active'));
        if (tool === 'anesthesia') {
            btnAnesthesia.classList.add('active');
            currentTool = 'anesthesia';
            setStatus(`Инструмент: Анестезия (${getAnestheticName(game.selectedAnesthetic)})`);
        } else if (tool === 'drill') {
            btnDrill.classList.add('active');
            currentTool = 'drill';
            setStatus('Инструмент: Бормашина (требуется анестезия)');
        } else if (tool === 'antiseptic') {
            btnAntiseptic.classList.add('active');
            currentTool = 'antiseptic';
            setStatus('Инструмент: Антисептик (после бормашины / для пустого места)');
        } else if (tool === 'extract') {
            btnExtract.classList.add('active');
            currentTool = 'extract';
            setStatus('Инструмент: Удаление (только невылечиваемые зубы, нужна анестезия)');
        } else if (tool === 'fill') {
            btnFill.classList.add('active');
            currentTool = 'fill';
            setStatus(`Инструмент: Пломба (💰 ${FILL_PRICE}, нужна анестезия и антисептик)`);
        } else {
            currentTool = null;
            setStatus('Выберите инструмент');
        }
    }

    btnAnesthesia.addEventListener('click', () => { setActiveTool('anesthesia'); playSound('click'); });
    btnDrill.addEventListener('click', () => { setActiveTool('drill'); playSound('click'); });
    btnAntiseptic.addEventListener('click', () => { setActiveTool('antiseptic'); playSound('click'); });
    btnExtract.addEventListener('click', () => { setActiveTool('extract'); playSound('click'); });
    btnFill.addEventListener('click', () => { setActiveTool('fill'); playSound('click'); });

    btnBuy.addEventListener('click', () => {
        const anes = game.selectedAnesthetic;
        const info = ANESTHETICS[anes];
        if (game.money < info.price) {
            showToast(`Недостаточно денег! Нужно 💰 ${info.price}`, false);
            playSound('error');
            return;
        }
        game.money -= info.price;
        game.anestheticStock[anes] = (game.anestheticStock[anes] || 0) + 1;
        updateCounters();
        updateAnestheticInfo();
        playSound('coin');
        showToast(`Куплен ${info.name} за 💰 ${info.price}`, true);
    });

    btnReset.addEventListener('click', () => {
        playSound('click');
        generateToothData(game.currentLevel);
        game.anesthesiaUsed = 0;
        game.treatedCount = 0;
        game.anesthesiaTimers.forEach(t => clearTimeout(t.timerId));
        game.anesthesiaTimers.clear();
        if (game.timerInterval) clearInterval(game.timerInterval);
        game.timerInterval = null;
        game.activeTimerTooth = null;
        timerBar.style.display = 'none';
        renderTeeth();
        setActiveTool(null);
        updateCounters();
        setStatus('Симулятор сброшен');
        showToast('Все зубы сброшены', true);
    });

    btnBack.addEventListener('click', () => {
        playSound('click');
        game.gameActive = false;
        game.anesthesiaTimers.forEach(t => clearTimeout(t.timerId));
        game.anesthesiaTimers.clear();
        if (game.timerInterval) clearInterval(game.timerInterval);
        game.timerInterval = null;
        timerBar.style.display = 'none';
        levelScreen.style.display = 'flex';
        renderLevels();
    });

    // ========== ВЫБОР АНЕСТЕТИКА ==========
    function getAnestheticName(k) {
        return ANESTHETICS[k] ? ANESTHETICS[k].name : k;
    }

    function updateAnestheticSelect() {
        const lvl = LEVELS[game.currentLevel];
        const unlocked = lvl.unlockedAnesthetics;
        anestheticSelect.innerHTML = '';
        ANESTHETIC_ORDER.forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            const info = ANESTHETICS[key];
            const isUnlocked = unlocked.includes(key);
            const stock = game.anestheticStock[key] || 0;
            if (isUnlocked) {
                opt.textContent = `${info.name} (⏱${info.duration}с, 💰${info.price}) [${stock}]`;
            } else {
                opt.textContent = `🔒 ${info.name} (недоступен)`;
                opt.disabled = true;
            }
            if (key === game.selectedAnesthetic) opt.selected = true;
            anestheticSelect.appendChild(opt);
        });
        updateAnestheticInfo();
    }

    function updateAnestheticInfo() {
        const key = game.selectedAnesthetic;
        const info = ANESTHETICS[key];
        const stock = game.anestheticStock[key] || 0;
        const lvl = LEVELS[game.currentLevel];
        const isUnlocked = lvl.unlockedAnesthetics.includes(key);
        if (!isUnlocked) {
            anestheticInfo.textContent = '🔒 Недоступен на этом уровне';
            btnBuy.disabled = true;
            return;
        }
        anestheticInfo.innerHTML = `⏱ Длительность: ${info.duration}с · 💰 Цена: ${info.price} · В наличии: ${stock}`;
        btnBuy.textContent = `Купить (💰 ${info.price})`;
        btnBuy.disabled = false;
    }

    anestheticSelect.addEventListener('change', (e) => {
        game.selectedAnesthetic = e.target.value;
        updateAnestheticInfo();
        if (currentTool === 'anesthesia') {
            setStatus(`Инструмент: Анестезия (${getAnestheticName(game.selectedAnesthetic)})`);
        }
    });

    // ========== СТАРТ УРОВНЯ ==========
    function startLevel(levelIdx) {
        game.currentLevel = levelIdx;
        const lvl = LEVELS[levelIdx];
        game.money = lvl.startMoney;
        game.patientsGoal = lvl.patientsGoal;
        game.treatedCount = 0;
        game.anesthesiaUsed = 0;
        game.anestheticStock = { ...lvl.startAnesthetics };
        game.selectedAnesthetic = lvl.unlockedAnesthetics[0];
        game.gameActive = true;
        game.anesthesiaTimers.forEach(t => clearTimeout(t.timerId));
        game.anesthesiaTimers.clear();
        if (game.timerInterval) clearInterval(game.timerInterval);
        game.timerInterval = null;
        game.activeTimerTooth = null;
        timerBar.style.display = 'none';

        ANESTHETIC_ORDER.forEach(k => {
            if (!(k in game.anestheticStock)) game.anestheticStock[k] = 0;
        });

        hospitalTitle.textContent = lvl.name;
        generateToothData(levelIdx);
        renderTeeth();
        updateAnestheticSelect();
        updateCounters();
        setActiveTool(null);
        levelScreen.style.display = 'none';
        setStatus(`Добро пожаловать в ${lvl.name} (${lvl.city})`);
        showToast(`🏥 ${lvl.name} — вылечите ${lvl.patientsGoal} пациентов!`, true);
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    renderLevels();
    updateCounters();

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.tooth')) tooltipEl.style.display = 'none';
    });
    document.body.addEventListener('click', () => { getAudioContext(); }, { once: true });
})();
</script>
</body>
</html>
